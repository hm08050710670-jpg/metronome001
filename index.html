<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FDFCF7">
<title>GOLF GUTS METRONOME</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root{
    --ivory:#FDFCF7;
    --green:#02543F;
    --black:#111111;
    --soft:#E4DFD3;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--ivory);color:var(--black);}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Helvetica Neue",Arial,sans-serif;
    -webkit-user-select:none;user-select:none;
    -webkit-touch-callout:none;
    overflow-x:hidden;
    min-height:100vh;min-height:100dvh;
  }
  .app{
    width:100%;max-width:430px;margin:0 auto;
    padding:calc(env(safe-area-inset-top) + 28px) calc(env(safe-area-inset-right) + 18px)
            calc(env(safe-area-inset-bottom) + 28px) calc(env(safe-area-inset-left) + 18px);
    display:flex;flex-direction:column;align-items:center;
  }

  /* ---- ロゴ：正規画像をそのまま表示（比率固定） ---- */
  .logo{display:block;width:68%;max-width:270px;height:auto;margin:0 auto;}

  /* ---- METRONOME（左右に細線） ---- */
  .title{
    display:flex;align-items:center;gap:16px;width:100%;
    margin:22px 0 20px;color:var(--green);
    font-size:16px;font-weight:700;letter-spacing:.3em;
  }
  .title::before,.title::after{content:"";flex:1;height:1.5px;background:var(--green);}
  .title span{padding-left:.3em;}

  /* ---- 選択ボタン ---- */
  .seg{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;margin-bottom:10px;}
  .opt{
    appearance:none;-webkit-appearance:none;font:inherit;cursor:pointer;
    height:60px;border-radius:18px;border:1.5px solid var(--green);
    background:var(--ivory);color:var(--black);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    font-size:22px;font-weight:800;letter-spacing:.04em;line-height:1;
    touch-action:manipulation;outline:none;
  }
  .opt.tempo{height:76px;font-size:26px;}
  .opt small{font-size:12px;font-weight:700;letter-spacing:.1em;color:#555;}
  .opt{transition:background-color .15s,color .15s,transform .08s;}
  .opt:active{transform:scale(.97);}
  .opt.sel,.opt[aria-pressed="true"]{background:var(--green);color:#fff;}
  .opt.sel small,.opt[aria-pressed="true"] small{color:#fff;}
  .opt:focus-visible{box-shadow:0 0 0 3px rgba(2,84,63,.25);}

  .meter{margin:10px 0 8px;font-size:13px;font-weight:700;color:var(--green);letter-spacing:.2em;}

  /* ---- ①②③：同一サイズの楕円・同一線幅・等間隔 ---- */
  .beats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%;margin-bottom:24px;}
  .beat{
    position:relative;width:100%;aspect-ratio:29/37;border-radius:50%;
    border:1.5px solid var(--soft);background:var(--ivory);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding-bottom:6%;
    transition:border-color .08s,background-color .08s,box-shadow .08s;
  }
  .num{
    width:30%;aspect-ratio:1/1;border-radius:50%;
    border:2px solid var(--black);background:var(--ivory);color:var(--black);
    display:flex;align-items:center;justify-content:center;
    font-size:clamp(15px,5vw,20px);font-weight:800;line-height:1;
  }
  .fig{width:62%;height:auto;display:block;margin-top:5%;min-width:0;}
  .fig .gap{stroke:var(--ivory);}
  .fig .ball{fill:var(--ivory);}
  .beat.on .fig .gap{stroke:#E3F0E7;}
  .beat.on .fig .ball{fill:#E3F0E7;}
  .beat.on{border-color:var(--green);background:#E3F0E7;box-shadow:0 0 0 1.5px var(--green),0 0 14px 2px rgba(2,84,63,.28);}
  .beat.on .num{background:var(--green);border-color:var(--green);color:#fff;}
  .beat.flash{animation:glow .42s ease-out;}
  .beat.flash .num{animation:numglow .42s ease-out;}
  @keyframes glow{
    0%  {background:#BFE0CB;box-shadow:0 0 0 3px var(--green),0 0 30px 10px rgba(2,84,63,.55);}
    100%{background:#E3F0E7;box-shadow:0 0 0 1.5px var(--green),0 0 14px 2px rgba(2,84,63,.28);}
  }
  @keyframes numglow{
    0%  {transform:scale(1.18);box-shadow:0 0 14px 4px rgba(2,84,63,.6);}
    100%{transform:scale(1);box-shadow:0 0 0 0 rgba(2,84,63,0);}
  }

  /* ---- START / STOP：サイズ固定 ---- */
  .play{
    appearance:none;-webkit-appearance:none;font:inherit;cursor:pointer;
    width:100%;height:72px;border-radius:36px;border:none;
    background:var(--green);color:#fff;
    display:flex;align-items:center;justify-content:center;gap:14px;
    font-size:24px;font-weight:800;letter-spacing:.14em;
    touch-action:manipulation;outline:none;
  }
  .play:active{opacity:.88;}
  .play .ico{width:24px;display:inline-flex;justify-content:center;}
  .play .lbl{width:5em;text-align:left;}

  /* ---- 音量 ---- */
  .vol{width:100%;margin-top:18px;}
  .vol-head{display:flex;justify-content:space-between;align-items:baseline;margin:0 6px 2px;color:var(--green);font-weight:700;}
  .vol-head span:first-child{font-size:11px;letter-spacing:.24em;}
  .vol-num{font-size:14px;font-variant-numeric:tabular-nums;}
  .slider{position:relative;height:40px;touch-action:none;cursor:pointer;outline:none;}
  .track{position:absolute;left:14px;right:14px;top:50%;height:4px;margin-top:-2px;border-radius:2px;background:rgba(2,84,63,.16);}
  .fill{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--green);}
  .thumb{position:absolute;top:50%;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;
         background:#fff;border:2px solid var(--green);box-shadow:0 1px 4px rgba(0,0,0,.12);}
  .slider:focus-visible .thumb{box-shadow:0 0 0 4px rgba(2,84,63,.25);}

  /* ---- ストローク測定への入口 ---- */
  .stroke-link{
    display:flex;align-items:center;justify-content:center;gap:8px;
    width:100%;height:54px;margin-top:20px;border-radius:18px;
    border:1.5px solid var(--green);background:var(--ivory);color:var(--green);
    font-size:16px;font-weight:800;letter-spacing:.14em;text-decoration:none;
    touch-action:manipulation;
  }
  .stroke-link:active{opacity:.7;}

  /* ---- タグライン ---- */
  .tagline{margin-top:22px;text-align:center;color:var(--green);font-size:13px;font-weight:500;letter-spacing:.28em;line-height:2;}
</style>
</head>

<script>
(() => {
  'use strict';

  // ===== 固定仕様 =====
  const BEATS_PER_BAR = 3;          // 3/4拍子
  const LOOKAHEAD_MS  = 25;         // スケジューラ起動間隔
  const SCHEDULE_AHEAD = 0.12;      // 何秒先まで予約するか

  const state = { bpm: 90, volume: 70, playing: false };

  // ===== 要素 =====
  const beatEls = [...document.querySelectorAll('.beat')];
  const playBtn = document.getElementById('play');
  const ico = document.getElementById('ico');
  const lbl = document.getElementById('lbl');

  // ===== 選択ボタン（状態を保持） =====
  function bindGroup(attr, key, parse) {
    const btns = [...document.querySelectorAll(`[data-${attr}]`)];
    btns.forEach(b => b.addEventListener('click', () => {
      state[key] = parse(b.dataset[attr]);
      btns.forEach(x => { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); x.classList.toggle('sel', x === b); });
    }));
  }
  bindGroup('tempo', 'bpm', Number);

  // ===== オーディオ =====
  let ctx = null, master = null, timerId = null;
  let nextTime = 0, beatIndex = 0;
  const visualQueue = [];

  // 聴感カーブ：0% = 完全無音、100% = 最大
  const volToGain = v => v <= 0 ? 0 : Math.pow(v / 100, 2);

  function ensureAudio() {
    if (!ctx) {
      // iPhoneのマナースイッチON時も鳴らす（Safari 17+）
      try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
      const AC = window.AudioContext || window.webkitAudioContext;
      ctx = new AC({ latencyHint: 'interactive' });
      master = ctx.createGain();
      master.gain.value = volToGain(state.volume);
      master.connect(ctx.destination);
    }
    if (!recSounds) recSounds = makeRecSounds(ctx.sampleRate);
    if (ctx.state !== 'running') ctx.resume();
    // iOSのアンロック：ユーザー操作内で無音バッファを1回鳴らす
    const b = ctx.createBuffer(1, 1, ctx.sampleRate);
    const s = ctx.createBufferSource(); s.buffer = b; s.connect(ctx.destination); s.start(0);
  }

  // 1音：サイン波＋エンベロープ（予約時刻 t に正確に発音）
  function tone(t, freq, dur, peak, type = 'sine', attack = 0.002) {
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(peak, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.02);
  }

  // ===== 動画の音を再現：「ピッ」（1拍目）＋「カッ」（2・3拍目） =====
  // 録音の分析値：1拍目＝1962Hzの矩形波系トーン（減衰 約40ms）＋クリック、2・3拍目＝約5msの短いクリック
  function makeRecSounds(sr) {
    const bp = (x, f0, Q) => {
      const w = 2 * Math.PI * f0 / sr, al = Math.sin(w) / (2 * Q);
      const a0 = 1 + al, a1 = -2 * Math.cos(w), a2 = 1 - al, b0 = al, b2 = -al;
      const y = new Float32Array(x.length); let x1 = 0, x2 = 0, y1 = 0, y2 = 0;
      for (let i = 0; i < x.length; i++) { const v = x[i]; const o = (b0 * v + b2 * x2 - a1 * y1 - a2 * y2) / a0; x2 = x1; x1 = v; y2 = y1; y1 = o; y[i] = o; }
      return y;
    };
    const lp = (x, fc) => { const a = Math.exp(-2 * Math.PI * fc / sr); let p = 0; for (let i = 0; i < x.length; i++) { p = (1 - a) * x[i] + a * p; x[i] = p; } return x; };
    // クリック（毎回まったく同じ波形になるよう固定シードのノイズ）
    const nC = Math.round(0.06 * sr), click = new Float32Array(nC);
    let s = 7; const nz = new Float32Array(nC);
    for (let i = 0; i < nC; i++) { s = (s * 1103515245 + 12345) & 0x7fffffff; nz[i] = s / 0x3fffffff - 1; }
    const nf = bp(nz, 2000, 0.45);
    const modes = [[1144, .7, 0], [1239, 1, 1.0], [1372, .8, 2.0], [2563, .9, .5], [2621, .7, 2.5], [850, .35, .3]];
    for (let i = 0; i < nC; i++) {
      const t = i / sr; let v = 0;
      if (t < 0.04) {
        const e = Math.exp(-t / 0.0032);
        for (const [f, a, ph] of modes) v += a * Math.sin(2 * Math.PI * f * t + ph) * e;
        v += 3 * nf[i] * Math.exp(-t / 0.002);
      }
      v += 0.09 * Math.sin(2 * Math.PI * 1239 * t) * Math.exp(-t / 0.016);
      click[i] = v;
    }
    lp(click, 9000);
    // 1拍目のトーン
    const nT = Math.round(0.3 * sr), accent = new Float32Array(nT);
    const harm = [[1, 1], [3, .3], [5, .15], [7, .114], [9, .067]];
    for (let i = 0; i < nT; i++) {
      const t = i / sr; let v = 0;
      for (const [k, g] of harm) v += g * Math.sin(2 * Math.PI * 1962 * k * t);
      accent[i] = 0.4 * v * Math.min(t / 0.0008, 1) * Math.exp(-t / 0.04) + (i < nC ? click[i] : 0);
    }
    // 音量をそろえる（1拍目のピークを 0.9 に）
    let pk = 0; for (const v of accent) pk = Math.max(pk, Math.abs(v));
    const k = 0.9 / pk;
    for (let i = 0; i < nT; i++) accent[i] *= k;
    for (let i = 0; i < nC; i++) click[i] *= k;
    const clickOnly = click.map(v => v * 0.73);   // 録音では2・3拍目が1拍目より約3dB小さい
    // 始まりと終わりをなめらかに
    for (const arr of [accent, clickOnly]) { const f = Math.round(0.004 * sr); for (let i = 0; i < f; i++) arr[arr.length - 1 - i] *= i / f; }
    const toBuf = arr => { const b = ctx.createBuffer(1, arr.length, sr); b.getChannelData(0).set(arr); return b; };
    return { accent: toBuf(accent), click: toBuf(clickOnly) };
  }
  let recSounds = null;
  function playBuf(t, buf) { const s = ctx.createBufferSource(); s.buffer = buf; s.connect(master); s.start(t); }
  function soundRec(t, beat) {
    if (!recSounds) recSounds = makeRecSounds(ctx.sampleRate);
    playBuf(t, beat === 0 ? recSounds.accent : recSounds.click);
  }

  function scheduleBeat(t, beat) {
    if (state.volume > 0) soundRec(t, beat);
    visualQueue.push({ t, beat });
  }

  function scheduler() {
    const now = ctx.currentTime;
    // バックグラウンド復帰等で遅れた場合は連打せず仕切り直す
    if (nextTime < now - 0.05) nextTime = now + 0.05;
    while (nextTime < now + SCHEDULE_AHEAD) {
      scheduleBeat(nextTime, beatIndex);
      nextTime += 60 / state.bpm;
      beatIndex = (beatIndex + 1) % BEATS_PER_BAR;
    }
  }

  // 実際にスピーカーから出ている時刻に合わせて表示を切り替える
  function heardTime() {
    if (ctx.getOutputTimestamp) {
      const ts = ctx.getOutputTimestamp();
      if (ts && ts.contextTime > 0 && ts.performanceTime > 0) {
        return ts.contextTime + (performance.now() - ts.performanceTime) / 1000;
      }
    }
    return ctx.currentTime - (ctx.outputLatency || ctx.baseLatency || 0);
  }

  function setActive(i, flash) {
    beatEls.forEach((el, k) => {
      el.classList.toggle('on', k === i);
      el.classList.remove('flash');
    });
    if (flash) { void beatEls[i].offsetWidth; beatEls[i].classList.add('flash'); }
  }

  function draw() {
    if (!state.playing) return;
    const h = heardTime();
    let cur = null;
    while (visualQueue.length && visualQueue[0].t <= h) cur = visualQueue.shift();
    if (cur) setActive(cur.beat, true);
    requestAnimationFrame(draw);
  }

  // ===== 画面スリープ防止 =====
  let wakeLock = null;
  async function lockScreen() {
    try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
  }
  function unlockScreen() { try { wakeLock && wakeLock.release(); } catch (e) {} wakeLock = null; }

  // ===== START / STOP =====
  function start() {
    ensureAudio();
    state.playing = true;
    beatIndex = 0;
    visualQueue.length = 0;
    nextTime = ctx.currentTime + 0.08;
    scheduler();
    timerId = setInterval(scheduler, LOOKAHEAD_MS);
    requestAnimationFrame(draw);
    ico.textContent = 'Ⅱ'; lbl.textContent = 'STOP'; playBtn.setAttribute('aria-label', 'STOP');
    lockScreen();
  }

  function stop() {
    state.playing = false;
    clearInterval(timerId); timerId = null;
    visualQueue.length = 0;
    // 予約済みの音も即停止
    if (master) {
      const old = master;
      old.gain.cancelScheduledValues(ctx.currentTime);
      old.gain.setValueAtTime(0, ctx.currentTime);
      setTimeout(() => old.disconnect(), 700);
      master = ctx.createGain();
      master.gain.value = volToGain(state.volume);
      master.connect(ctx.destination);
    }
    setActive(0);
    ico.textContent = '▶'; lbl.textContent = 'START'; playBtn.setAttribute('aria-label', 'START');
    unlockScreen();
  }

  playBtn.addEventListener('click', () => state.playing ? stop() : start());

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && state.playing) {
      if (ctx && ctx.state !== 'running') ctx.resume();
      lockScreen();
    }
  });

  // ===== 音量スライダー（指に追従・トラックどこでもタップ可） =====
  const slider = document.getElementById('slider');
  const track = document.getElementById('track');
  const fill = document.getElementById('fill');
  const thumb = document.getElementById('thumb');
  const volNum = document.getElementById('volNum');

  function setVolume(v) {
    v = Math.max(0, Math.min(100, Math.round(v)));
    state.volume = v;
    fill.style.width = v + '%';
    thumb.style.left = v + '%';
    volNum.textContent = v + '%';
    slider.setAttribute('aria-valuenow', v);
    if (master && ctx) {
      const g = master.gain, t = ctx.currentTime;
      g.cancelScheduledValues(t);
      g.setValueAtTime(g.value, t);
      g.linearRampToValueAtTime(volToGain(v), t + 0.015);
    }
  }
  function fromPointer(e) {
    const r = track.getBoundingClientRect();
    setVolume(((e.clientX - r.left) / r.width) * 100);
  }
  slider.addEventListener('pointerdown', e => {
    slider.setPointerCapture(e.pointerId);
    fromPointer(e);
    e.preventDefault();
  });
  slider.addEventListener('pointermove', e => {
    if (slider.hasPointerCapture(e.pointerId)) fromPointer(e);
  });
  slider.addEventListener('keydown', e => {
    const step = { ArrowRight: 5, ArrowUp: 5, ArrowLeft: -5, ArrowDown: -5 }[e.key];
    if (step) { setVolume(state.volume + step); e.preventDefault(); }
    if (e.key === 'Home') setVolume(0);
    if (e.key === 'End') setVolume(100);
  });
  setVolume(70);

  // ===== ストローク測定への入口（選択中のテンポを引き継ぐ） =====
  const strokeLink = document.getElementById('strokeLink');
  if (strokeLink) strokeLink.addEventListener('click', () => { strokeLink.href = 'stroke.html?bpm=' + state.bpm; });

  // ===== Service Worker（既存 sw.js。更新を即時確認） =====
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
      .then(r => r.update()).catch(() => {});
  }
})();
</script>
</body>
</html>
